<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政大資管系特約商店地圖</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nccuBlue: '#5B92E5',
                        nccuDarkBlue: '#3B71CA',
                        nccuYellow: '#F5C242',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sky-50 text-slate-800 min-h-screen pb-12">

    <!-- Header 頂部導覽列 -->
    <header class="bg-gradient-to-r from-sky-500 via-sky-600 to-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-2.5 flex justify-between items-center">
            
            <!-- Logo 與系徽頭貼 -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-amber-300 overflow-hidden shadow-inner shrink-0 bg-sky-300">
                    <img src="https://i.imgur.com/v8tT7s8.jpg" alt="政大資管系學會" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150/5B92E5/FFFFFF?text=MIS'">
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-bold tracking-wide flex items-center gap-1.5 text-white">
                        政大資管特約商店 <span class="text-amber-300 text-xs font-black bg-white/20 px-1.5 py-0.5 rounded-full">★ MIS</span>
                    </h1>
                    <p class="text-[11px] text-sky-100">NCCU MIS Student Association</p>
                </div>
            </div>
            
            <!-- 視圖切換 & 管理者按鈕 -->
            <div class="flex items-center gap-2">
                <div class="bg-sky-800/40 backdrop-blur-sm p-1 rounded-xl flex gap-1 text-xs font-bold border border-white/20">
                    <button id="viewListBtn" onclick="switchView('list')" class="px-3 py-1.5 rounded-lg bg-amber-400 text-slate-900 shadow transition">
                        <i class="fa-solid fa-list mr-1"></i>列表
                    </button>
                    <button id="viewMapBtn" onclick="switchView('map')" class="px-3 py-1.5 rounded-lg text-white hover:bg-white/10 transition">
                        <i class="fa-solid fa-map-location-dot mr-1"></i>地圖
                    </button>
                </div>
                <!-- 後台管理入口按鈕 -->
                <button onclick="openAuthOrAdmin()" id="adminNavBtn" title="後台管理" class="bg-amber-400 hover:bg-amber-300 text-slate-900 text-xs px-3 py-2 rounded-xl font-bold transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-lock"></i> <span class="hidden sm:inline">幹部登入</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-5">
        
        <!-- 一鍵匯入提示按鈕欄位 -->
        <div class="bg-amber-100 border border-amber-300 p-3 rounded-2xl mb-4 flex justify-between items-center text-xs text-amber-900">
            <span><i class="fa-solid fa-wand-magic-sparkles text-amber-600 mr-1"></i> 首次使用？點擊右側按鈕自動匯入 Excel 中的 16 家店家資料至 Firebase：</span>
            <button onclick="seedDataNow()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-1.5 rounded-xl shadow transition shrink-0 ml-2">
                🚀 一鍵匯入 16 家店家
            </button>
        </div>

        <!-- 1. 列表視圖區域 (List View) -->
        <div id="listViewSection">
            <!-- 搜尋欄位 -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-sky-100 mb-4 flex gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-sky-400"></i>
                    <input type="text" id="searchInput" oninput="renderStores()" placeholder="搜尋店家名稱、優惠內容..." 
                           class="w-full pl-10 pr-4 py-1.5 border border-sky-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 text-sm bg-sky-50/30">
                </div>
            </div>

            <!-- 區域分頁籤 -->
            <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none" id="locationTabs">
                <button onclick="filterLocation('ALL')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-sky-500 text-white shadow-sm">全部店家</button>
                <button onclick="filterLocation('新光路一段')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-white text-slate-600 border border-sky-100 hover:bg-sky-50">新光路一段</button>
                <button onclick="filterLocation('大門左轉')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-white text-slate-600 border border-sky-100 hover:bg-sky-50">大門左轉</button>
                <button onclick="filterLocation('大門右轉')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-white text-slate-600 border border-sky-100 hover:bg-sky-50">大門右轉</button>
                <button onclick="filterLocation('ㄆㄨㄣ街')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-white text-slate-600 border border-sky-100 hover:bg-sky-50">ㄆㄨㄣ街</button>
                <button onclick="filterLocation('後山')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-white text-slate-600 border border-sky-100 hover:bg-sky-50">後山</button>
            </div>

            <!-- 店家卡片列表 -->
            <div id="storeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-10 text-slate-400 text-sm">
                    <i class="fa-solid fa-circle-notch fa-spin text-sky-500 text-xl mb-2"></i>
                    <p>正在載入最新店家資料...</p>
                </div>
            </div>
        </div>

        <!-- 2. 地圖視圖區域 (Map View) -->
        <div id="mapViewSection" class="hidden space-y-4">
            <div class="bg-sky-100/70 border border-sky-200 p-3 rounded-xl flex justify-between items-center text-xs text-sky-900">
                <span><i class="fa-solid fa-map-marked-alt text-sky-600 mr-1"></i> 點擊地圖上的地標即可查看真實位置與資管系專屬優惠！</span>
            </div>
        
            <div class="w-full h-[600px] rounded-2xl overflow-hidden shadow-md border border-sky-100">
                <iframe 
                    src="https://www.google.com/maps/d/embed?mid=19SNNMSp_0NhiVM00-DYnxs1RSk4gOAs&ehbc=2E312F"
                    width="100%" 
                    height="100%" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </main>

    <!-- Modal 1: 幹部登入彈窗 -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl p-6">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800">資管系幹部後台登入</h3>
                <p class="text-xs text-slate-400 mt-1">請輸入 Firebase 建立的管理者帳密</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-600">管理員 Email</label>
                    <input type="email" id="loginEmail" required class="w-full text-xs p-2.5 rounded-xl border border-slate-200 mt-1 focus:ring-2 focus:ring-sky-400 outline-none" placeholder="admin@nccu.edu.tw">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">密碼</label>
                    <input type="password" id="loginPassword" required class="w-full text-xs p-2.5 rounded-xl border border-slate-200 mt-1 focus:ring-2 focus:ring-sky-400 outline-none" placeholder="••••••••">
                </div>
                <div id="loginError" class="text-xs text-rose-500 font-bold hidden"></div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeLoginModal()" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-200">取消</button>
                    <button type="submit" id="loginSubmitBtn" class="flex-1 py-2 bg-sky-500 text-white rounded-xl text-xs font-bold hover:bg-sky-600 shadow">登入後台</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2: 後台資料庫管理彈窗 -->
    <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
            <div class="bg-gradient-to-r from-sky-500 to-indigo-600 text-white p-4 flex justify-between items-center">
                <h3 class="text-base font-bold flex items-center gap-2">
                    <i class="fa-solid fa-database text-amber-300"></i> 後台雲端資料庫管理
                </h3>
                <div class="flex items-center gap-3">
                    <button onclick="handleLogout()" class="text-xs bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-lg text-white font-medium transition">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i>登出
                    </button>
                    <button onclick="closeAdminModal()" class="text-white/80 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            
            <div class="p-5 space-y-5 overflow-y-auto flex-1">
                <!-- 新增 / 編輯表格 -->
                <form id="storeForm" onsubmit="saveStore(event)" class="bg-sky-50/50 p-4 rounded-xl border border-sky-100 grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="hidden" id="editId">
                    <div>
                        <label class="text-xs font-bold text-slate-600">店家名稱</label>
                        <input type="text" id="formName" required placeholder="例如：政大茶亭" class="w-full text-xs p-2 rounded-lg border border-slate-200 mt-1 focus:ring-2 focus:ring-sky-400 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-600">所屬區域</label>
                        <select id="formLocation" class="w-full text-xs p-2 rounded-lg border border-slate-200 mt-1 focus:ring-2 focus:ring-sky-400 outline-none bg-white">
                            <option value="新光路一段">新光路一段</option>
                            <option value="大門左轉">大門左轉</option>
                            <option value="大門右轉">大門右轉</option>
                            <option value="ㄆㄨㄣ街">ㄆㄨㄣ街</option>
                            <option value="後山">後山</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-xs font-bold text-slate-600">專屬優惠內容</label>
                        <input type="text" id="formDiscount" required placeholder="例如：結帳 95 折" class="w-full text-xs p-2 rounded-lg border border-slate-200 mt-1 focus:ring-2 focus:ring-sky-400 outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-xs font-bold text-slate-600">營業時間</label>
                        <input type="text" id="formHours" required placeholder="例如：11:00–20:00" class="w-full text-xs p-2 rounded-lg border border-slate-200 mt-1 focus:ring-2 focus:ring-sky-400 outline-none">
                    </div>
                    <div class="md:col-span-2 flex gap-2 justify-end mt-2">
                        <button type="button" onclick="resetForm()" class="px-3 py-1.5 bg-slate-200 text-slate-600 rounded-lg text-xs font-bold hover:bg-slate-300">清空</button>
                        <button type="submit" id="saveSubmitBtn" class="px-4 py-1.5 bg-sky-500 text-white rounded-lg text-xs font-bold hover:bg-sky-600 shadow"><i class="fa-solid fa-floppy-disk mr-1"></i>儲存至 Firebase 雲端</button>
                    </div>
                </form>

                <!-- 店家列表管理表格 -->
                <div class="border border-slate-200 rounded-xl overflow-hidden">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                            <tr>
                                <th class="p-2.5">店家名稱</th>
                                <th class="p-2.5">區域</th>
                                <th class="p-2.5">優惠內容</th>
                                <th class="p-2.5 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 載入 Firebase JS SDK (v9 模組化 CDN) -->
    <!-- 載入 Firebase JS SDK (v9 模組化 CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // ====================================================
        // ⚠️ 請確保下方已替換為您從 Firebase 控制台複製出來的金鑰 ⚠️
        // ====================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDYyPFHzFXCpzWocnjXjU6V-XsCgC5A8ew",
          authDomain: "nccu-mis-store.firebaseapp.com",
         projectId: "nccu-mis-store",
         storageBucket: "nccu-mis-store.firebasestorage.app",
         messagingSenderId: "203189962352",
         appId: "1:203189962352:web:7ebc198e5c209f0a1b56b5",
         measurementId: "G-NV8FKMT8JF"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 先宣告全域變數
        window.storesData = [];
        let currentUser = null;
        let selectedLocation = 'ALL';

        // 1. 監聽身份驗證狀態
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const btn = document.getElementById('adminNavBtn');
            if (btn) {
                if (user) {
                    btn.innerHTML = `<i class="fa-solid fa-user-gear"></i> <span class="hidden sm:inline">後台管理</span>`;
                } else {
                    btn.innerHTML = `<i class="fa-solid fa-lock"></i> <span class="hidden sm:inline">幹部登入</span>`;
                }
            }
        });

        // 2. 監聽 Cloud Firestore 雲端資料庫
        const storesRef = collection(db, "stores");
        onSnapshot(storesRef, (snapshot) => {
            window.storesData = [];
            snapshot.forEach((docSnapshot) => {
                window.storesData.push({ id: docSnapshot.id, ...docSnapshot.data() });
            });
            window.renderStores();
            window.renderAdminTable();
        }, (error) => {
            console.error("Firestore 即時監聽失敗:", error);
        });

        // 3. 一鍵匯入 16 家店家（修復變數範圍並自動清理舊資料）
        window.seedDataNow = async (e) => {
            const btn = e ? e.currentTarget : document.querySelector('button[onclick*="seedDataNow"]');
            if (btn) {
                btn.disabled = true;
                btn.innerText = "寫入中，請稍候...";
            }

            const defaultStores = [
                { name: "Mr. Light 輕食先生", location: "新光路一段", discount: "點餐後加 10 元可加價購飲料（原價 39 元）", hours: "週一至週日 11:00–20:00" },
                { name: "里克德義廚房", location: "新光路一段", discount: "主餐折 10 元", hours: "週二至週五 11:30–14:30、17:00–20:30" },
                { name: "小靖子可麗餅", location: "新光路一段", discount: "一個折 5 元", hours: "週一至週五 14:00–20:00" },
                { name: "政大茶亭", location: "大門左轉", discount: "點冰沙送珍珠", hours: "週一至週日 10:20–21:30" },
                { name: "Come See Pizza", location: "大門左轉", discount: "滿 1,000 元打 95 折，滿 3,000 元打 9 折", hours: "週一、週三至週日 11:30–20:30" },
                { name: "大隻佬 食堂", location: "大門左轉", discount: "結帳 95 折", hours: "週一至週日 11:00–23:00" },
                { name: "提洛斯義式廚房", location: "大門右轉", discount: "內用全品項折 5 元（烤餅例外）", hours: "週一至週日 11:30–14:00、16:30–20:00" },
                { name: "華越美食", location: "大門右轉", discount: "折 5 元", hours: "週一至週六 11:00–14:00、17:00–20:00" },
                { name: "富美豚骨麻辣燙-政大店", location: "大門右轉", discount: "滿 150 元送 10-30 元飲料", hours: "週一至週五 11:30–15:00、16:30–20:30" },
                { name: "血盅紅 台北政大", location: "ㄆㄨㄣ街", discount: "點鍋類/鍋燒送兩片肉", hours: "週一至週五 11:00–20:00" },
                { name: "Warong Kita 珍妹麵店", location: "ㄆㄨㄣ街", discount: "滿 100 元以上折 5 元", hours: "週一至週五 11:00–14:00、16:30–20:00" },
                { name: "原丼力", location: "ㄆㄨㄣ街", discount: "全品項折 5 元", hours: "週一至週五 11:00–14:00、16:30–19:30" },
                { name: "飛捷廣告印刷有限公司", location: "ㄆㄨㄣ街", discount: "消費享 6 折", hours: "週一至週五 09:00–21:00" },
                { name: "匠記日式食堂", location: "後山", discount: "內用滿 100 元送 15 元小料", hours: "週一至週五、週日 17:00–00:00" },
                { name: "嘗香聚", location: "後山", discount: "滿 100 元送小杯飲料", hours: "19:00–10:00" },
                { name: "箸拉麵", location: "後山", discount: "免費加一球麵", hours: "11:30–14:30、17:30–20:30" }
            ];

            try {
                // 直接讀取 Firebase 現有舊資料並清空，避免重複寫入
                const querySnapshot = await getDocs(collection(db, "stores"));
                for (const docSnapshot of querySnapshot.docs) {
                    await deleteDoc(doc(db, "stores", docSnapshot.id));
                }

                // 寫入 16 家正確資料
                for (const store of defaultStores) {
                    await addDoc(collection(db, "stores"), store);
                }
                alert("🎉 匯入成功！16 家店家資料已完全寫入雲端 Firebase！");
            } catch (err) {
                alert("匯入失敗：" + err.message);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "🚀 一鍵匯入 16 家店家";
                }
            }
        };

        window.openAuthOrAdmin = () => {
            if (currentUser) {
                document.getElementById('adminModal').classList.remove('hidden');
                document.getElementById('adminModal').classList.add('flex');
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
                document.getElementById('loginModal').classList.add('flex');
            }
        };

        window.closeLoginModal = () => {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('loginModal').classList.remove('flex');
            document.getElementById('loginError').classList.add('hidden');
        };

        window.closeAdminModal = () => {
            document.getElementById('adminModal').classList.add('hidden');
            document.getElementById('adminModal').classList.remove('flex');
            window.resetForm();
        };

        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            const errDiv = document.getElementById('loginError');
            const submitBtn = document.getElementById('loginSubmitBtn');

            errDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = "驗證中...";

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.closeLoginModal();
                window.openAuthOrAdmin();
            } catch (err) {
                errDiv.innerText = "帳號或密碼錯誤，請確認後重試。";
                errDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "登入後台";
            }
        };

        window.handleLogout = async () => {
            if (confirm("確定要登出管理員身分嗎？")) {
                await signOut(auth);
                window.closeAdminModal();
            }
        };

        window.renderStores = () => {
            const queryInput = document.getElementById('searchInput');
            const query = queryInput ? queryInput.value.toLowerCase() : '';
            const grid = document.getElementById('storeGrid');
            if (!grid) return;
            grid.innerHTML = '';
            
            const filtered = (window.storesData || []).filter(s => {
                const matchesLoc = selectedLocation === 'ALL' || s.location === selectedLocation;
                const matchesSearch = (s.name && s.name.toLowerCase().includes(query)) || 
                                      (s.discount && s.discount.toLowerCase().includes(query));
                return matchesLoc && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 text-sm">沒有找到符合條件的店家</div>`;
                return;
            }

            filtered.forEach(store => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm hover:shadow-md transition border border-sky-100 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start">
                            <span class="text-[10px] font-bold bg-sky-100 text-sky-800 px-2 py-0.5 rounded-md">${store.location || '商圈'}</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base mt-2">${store.name}</h3>
                        <p class="text-xs text-sky-900 font-bold bg-amber-300/30 border border-amber-300/50 p-2.5 rounded-xl mt-2.5 inline-block w-full">
                            <i class="fa-solid fa-gift text-amber-500 mr-1"></i>${store.discount}
                        </p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 text-xs text-slate-500 flex justify-between items-center">
                        <span class="truncate"><i class="fa-regular fa-clock text-sky-500 mr-1"></i>${store.hours}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        window.renderAdminTable = () => {
            const tbody = document.getElementById('adminTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            (window.storesData || []).forEach(s => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-2.5 font-bold text-slate-800">${s.name}</td>
                    <td class="p-2.5 text-slate-500">${s.location}</td>
                    <td class="p-2.5 text-sky-700 font-medium">${s.discount}</td>
                    <td class="p-2.5 text-center flex justify-center gap-1">
                        <button onclick="editStore('${s.id}')" class="bg-sky-100 text-sky-700 p-1.5 rounded-md hover:bg-sky-200"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteStore('${s.id}')" class="bg-rose-100 text-rose-600 p-1.5 rounded-md hover:bg-rose-200"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        window.saveStore = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const name = document.getElementById('formName').value;
            const location = document.getElementById('formLocation').value;
            const discount = document.getElementById('formDiscount').value;
            const hours = document.getElementById('formHours').value;
            const saveBtn = document.getElementById('saveSubmitBtn');

            saveBtn.disabled = true;
            saveBtn.innerText = "儲存中...";

            try {
                if (id) {
                    await updateDoc(doc(db, "stores", id), { name, location, discount, hours });
                } else {
                    await addDoc(collection(db, "stores"), { name, location, discount, hours });
                }
                window.resetForm();
            } catch (err) {
                alert("儲存失敗，請重試：" + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = `<i class="fa-solid fa-floppy-disk mr-1"></i>儲存至 Firebase 雲端`;
            }
        };

        window.editStore = (id) => {
            const store = (window.storesData || []).find(s => s.id === id);
            if (!store) return;
            document.getElementById('editId').value = store.id;
            document.getElementById('formName').value = store.name;
            document.getElementById('formLocation').value = store.location;
            document.getElementById('formDiscount').value = store.discount;
            document.getElementById('formHours').value = store.hours;
        };

        window.deleteStore = async (id) => {
            if (confirm('確定要從雲端刪除此店家嗎？此動作不可逆。')) {
                try {
                    await deleteDoc(doc(db, "stores", id));
                } catch (err) {
                    alert("刪除失敗：" + err.message);
                }
            }
        };

        window.resetForm = () => {
            document.getElementById('storeForm').reset();
            document.getElementById('editId').value = '';
        };

        window.filterLocation = (loc) => {
            selectedLocation = loc;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.innerText.includes(loc) || (loc === 'ALL' && btn.innerText.includes('全部'))) {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-sky-500 text-white shadow-sm";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap bg-white text-slate-600 border border-sky-100 hover:bg-sky-50";
                }
            });
            window.renderStores();
        };

        window.switchView = (view) => {
            const listSec = document.getElementById('listViewSection');
            const mapSec = document.getElementById('mapViewSection');
            const listBtn = document.getElementById('viewListBtn');
            const mapBtn = document.getElementById('viewMapBtn');

            if (view === 'list') {
                listSec.classList.remove('hidden');
                mapSec.classList.add('hidden');
                listBtn.className = "px-3 py-1.5 rounded-lg bg-amber-400 text-slate-900 shadow transition";
                mapBtn.className = "px-3 py-1.5 rounded-lg text-white hover:bg-white/10 transition";
            } else {
                listSec.classList.add('hidden');
                mapSec.classList.remove('hidden');
                mapBtn.className = "px-3 py-1.5 rounded-lg bg-amber-400 text-slate-900 shadow transition";
                listBtn.className = "px-3 py-1.5 rounded-lg text-white hover:bg-white/10 transition";
            }
        };
    </script>
</body>
</html>
